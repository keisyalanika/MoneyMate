version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  provider: ^6.1.2 # <--- Package Provider ditambahkan di sini
