name: moneymate_mobile
description: "MoneyMate - Mobile Personal Finance App for Users"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  provider: ^6.1.2 # <--- Package Provider ditambahkan di sini
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  http_parser: ^4.1.2
  google_sign_in: ^6.2.2
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_moneymate.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF6F0"
  adaptive_icon_foreground: "assets/logo_moneymate.png"
  remove_alpha_ios: true
  web:
    generate: false

flutter_native_splash:
  color: "#FAF6F0"
  image: assets/logo_moneymate.png
  android_12:
    image: assets/logo_moneymate.png
    color: "#FAF6F0"
    icon_background_color: "#FAF6F0"
  android: true
  ios: true
  web: false
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/
