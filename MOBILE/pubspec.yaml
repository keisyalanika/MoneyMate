name: moneymate_mobile
description: "MoneyMate - Mobile Personal Finance App for Users"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  provider: ^6.1.2

  # =========================================================================
  # TUGAS 1: Database Lokal Terstruktur (Drift - Type Safe & Reaktif)
  # =========================================================================
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # =========================================================================
  # TUGAS 2: Pengaturan Non-Sensitif (shared_preferences)
  # =========================================================================
  shared_preferences: ^2.2.2

  # =========================================================================
  # TUGAS 3: Keamanan Rahasia Token / Kredensial (flutter_secure_storage)
  # =========================================================================
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generator untuk Drift ORM
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
